name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "firmware/**"
      - "gradle/**"
      - "*.gradle*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Build APK
        run: ./gradlew assembleDebug
      
      - name: Install PlatformIO
        run: pip install -U platformio
      
      - name: Build firmware
        working-directory: firmware
        run: pio run
      
      - name: Get version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Open DiKey ${{ steps.version.outputs.tag }}
          body: |
            ## Installation
            
            1. Flash `dikey-usb-bridge-c3.bin` onto an ESP32-C3 Super Mini
            2. Install `app-debug.apk` on the DiLink 5 head unit
            
            See the [README](https://github.com/sp-hy/Open-DiKey#installation) for details.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            firmware/dikey-usb-bridge-c3.bin
          draft: false
          prerelease: false
