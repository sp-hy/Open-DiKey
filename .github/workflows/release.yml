name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "firmware/**"
      - "gradle/**"
      - "*.gradle*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version
        id: version
        run: |
          NAME="$(date +'%Y.%m.%d-%H%M')"
          # Minutes since 2020-01-01 UTC — monotonic and fits in Android versionCode (Int).
          CODE="$(( ($(date -u +%s) - 1577836800) / 60 ))"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64. See README (Release signing)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. See README (Release signing)."
            exit 1
          fi
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        run: |
          mkdir -p dist
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Expected signed app-release.apk — check signing secrets / Gradle signingConfig."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk dist/open-dikey.apk

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Open DiKey ${{ steps.version.outputs.tag }}
          body: |
            ## Installation

            1. Flash `dikey-usb-bridge-c3.bin` onto an ESP32-C3 Super Mini
            2. Install `open-dikey.apk` on the DiLink 5 head unit

            See the [README](https://github.com/sp-hy/Open-DiKey#installation) for details.

            **Version:** `${{ steps.version.outputs.name }}` (code `${{ steps.version.outputs.code }}`)
          files: |
            dist/open-dikey.apk
            firmware/dikey-usb-bridge-c3.bin
          draft: false
          prerelease: false
