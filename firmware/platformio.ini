[platformio]
src_dir = src/DiKeyUsbBridge
default_envs = c3_super_mini

; ESP32-C3 Super Mini — native USB CDC + NimBLE central.
; pioarduino ships Arduino-ESP32 3.x (needed for NimBLE-Arduino 2.x).
[env:c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
extra_scripts = post:scripts/merge_bin.py
